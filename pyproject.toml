[project]
name = "healthmate"
version = "0.1.0"
description = "Medical RAG Chatbot using Mistral AI and ChromaDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-mistralai>=1.1.6",
    "langchain-chroma>=1.0.0",
    "langchain-text-splitters>=1.0.0",
    "pypdf>=6.16.1",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=5.7.0",
    "streamlit>=1.61.1",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false